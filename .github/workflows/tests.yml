# Runs the unit and UI tests on a Mac whenever code is pushed or a pull request is opened, so a new
# feature can't quietly break one that's already there.
name: Tests

on:
  push:
    branches: [main, "version-*", "dockorate-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The app icon is an Icon Composer file, which needs Xcode 26 or newer.
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild test -project FallDock.xcodeproj -scheme FallDock -destination 'platform=macOS' \
            -only-testing:DockorateTests -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify

      - name: UI tests
        run: |
          xcodebuild test -project FallDock.xcodeproj -scheme FallDock -destination 'platform=macOS' \
            -only-testing:DockorateUITests -resultBundlePath build/UITests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify

      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult
