# Runs the unit and UI tests, and checks the Mac App Store build, on a Mac whenever code is pushed or a pull request is opened, so a new
# feature can't quietly break one that's already there.
name: Tests

on:
  push:
    branches: [main, "version-*", "dockorate-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Stops a step as soon as xcodebuild fails.
    shell: bash

jobs:
  test:
    # The app icon is an Icon Composer file, which needs macOS 26 and Xcode 26 to build.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild test -project FallDock.xcodeproj -scheme FallDock -destination 'platform=macOS' \
            -only-testing:DockorateTests -resultBundlePath build/UnitTests.xcresult \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: UI tests
        run: |
          xcodebuild test -project FallDock.xcodeproj -scheme FallDock -destination 'platform=macOS' \
            -only-testing:DockorateUITests -resultBundlePath build/UITests.xcresult \
            -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: App Store build
        # Builds the Mac App Store version and checks it's sandboxed, has no Sparkle, and starts.
        if: ${{ !cancelled() }}
        run: scripts/check-appstore-build.sh

      - name: Show what failed
        if: failure()
        run: |
          for bundle in build/*.xcresult; do
            xcrun xcresulttool get test-results summary --path "$bundle" --compact || true
          done

      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult

  previews:
    # Only when the workflow is run by hand (Run workflow): draws the art into pictures to look at (see
    # DockorateTests/ArtPreviews.swift) and keeps them under refs/previews/<branch>, outside the branches. To look:
    #   git fetch origin refs/previews/<branch> && git worktree add ../previews FETCH_HEAD
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Draw the previews
        env:
          TEST_RUNNER_DOCKORATE_PREVIEWS: ${{ runner.temp }}/previews
        run: |
          xcodebuild test -project FallDock.xcodeproj -scheme FallDock -destination 'platform=macOS' \
            -only-testing:DockorateTests/ArtPreviews -quiet CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          ls -l "$RUNNER_TEMP/previews"

      - name: Keep the previews
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/previews"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Art previews for $GITHUB_REF_NAME at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/previews/$GITHUB_REF_NAME"
