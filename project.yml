# XcodeGen spec used once to create FallDock.xcodeproj. After that, edit the project in Xcode.
name: FallDock
options:
  bundleIdPrefix: com.amol
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  FallDock:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: FallDock
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Fall Dock
        PRODUCT_BUNDLE_IDENTIFIER: com.amol.falldock
        INFOPLIST_FILE: FallDock/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
